<line x1="45" y1="572" x2="875" y2="572" stroke="#EEF1F5"/>
<text class="s fade" x="45" y="584" font-size="7.5">Lessons below the coverage threshold are excluded with a reason, never counted as zero activity. Suppression decisions are logged. No teacher-level view exists anywhere in this dashboard.</text>
<text class="s fade" x="45" y="594" font-size="7.5">District release stays disabled until the aggregate disclosure tests in gate G5-E pass. Until then this page runs on synthetic records only.</text>
</svg>
