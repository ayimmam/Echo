</g>

<text class="s b ink" x="45" y="462" font-size="10">Language spoken by teachers, by grade</text>
<text class="s mut" x="45" y="476" font-size="7.5">Share of teacher speech only. "unclear" is the model abstaining on short or ambiguous speech — it is not another language, and it is never redistributed.</text>
