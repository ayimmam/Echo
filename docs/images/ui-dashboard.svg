  <rect x="115" y="509" width="312" height="14" fill="#0F6E63"/><rect x="427" y="509" width="246" height="14" fill="#3E7CB1"/><rect x="673" y="509" width="30" height="14" fill="#E8A33D"/><rect x="703" y="509" width="12" height="14" fill="#9AA4B2"/>
