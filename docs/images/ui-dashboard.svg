<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" role="img" aria-label="Echovolve woreda dashboard mockup: aggregate indicators by grade with minimum-group suppression, and language shares by grade.">
<title>Echovolve — woreda (district) dashboard mockup</title>
<desc>Target web dashboard for a woreda education officer. Shows aggregate indicators by grade, counted over distinct teachers, with cells below five teachers hidden, plus language shares of teacher speech by grade. All values are illustrative fixtures.</desc>
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif}
  .ink{fill:#10151E}.mut{fill:#5B6472}.fade{fill:#8A93A1}.b{font-weight:700}.sb{font-weight:600}
</style>
<rect width="920" height="620" fill="#F4F6F8"/>
<text class="s b ink" x="25" y="33" font-size="19">Echovolve — woreda (district) dashboard</text>
<text class="s mut" x="25" y="52" font-size="9.5">The only view above the individual teacher. The same code serves the Huawei Cloud demo page, where every record is synthetic.</text>

<rect x="25" y="70" width="870" height="530" rx="10" fill="#FFFFFF" stroke="#DDE2E9"/>
<path d="M25 80 a10 10 0 0 1 10 -10 h850 a10 10 0 0 1 10 10 v24 h-870z" fill="#E9EDF2"/>
<circle cx="45" cy="87" r="4.5" fill="#C6CEDA"/><circle cx="60" cy="87" r="4.5" fill="#C6CEDA"/><circle cx="75" cy="87" r="4.5" fill="#C6CEDA"/>
<rect x="94" y="78" width="480" height="18" rx="9" fill="#FFFFFF" stroke="#D7DDE5"/>
<path d="M107 87 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#2E9E5B" stroke-width="1.2"/><rect x="105.5" y="86.5" width="9" height="6.5" rx="1.5" fill="#2E9E5B"/>
<text class="s mut" x="121" y="90.5" font-size="8">https://dashboard.echovolve.et/woreda/hawassa-zuria?week=12</text>

<text class="s b ink" x="45" y="132" font-size="15">Woreda dashboard</text>
<rect x="698" y="116" width="182" height="20" rx="10" fill="#E8F1EF"/>
<text class="s sb" x="789" y="130" font-size="7.5" fill="#0B5F55" text-anchor="middle">In-country pilot tier · openEuler · Hawassa</text>
<text class="s mut" x="45" y="148" font-size="8.5">Hawassa Zuria · Week 12 (3–9 Nov 2026) · generated 10 Nov 08:00 EAT · indicator spec v2 · seg-student-0.3.1-int8</text>

<rect x="45" y="160" width="830" height="40" rx="6" fill="#EEF3F9" stroke="#D3DEEB"/>
<circle cx="61" cy="180" r="7" fill="#2C4A6B"/><text class="s b" x="61" y="183.5" font-size="9" fill="#FFFFFF" text-anchor="middle">i</text>
<text class="s" x="76" y="177" font-size="8" fill="#2C4A6B"><tspan class="b">Aggregates only.</tspan> Every cell counts distinct teachers, not lessons, and each teacher is averaged before the district figure is taken.</text>
<text class="s" x="76" y="190" font-size="8" fill="#2C4A6B">Cells with fewer than five teachers are hidden. Minimum-group suppression is not by itself a proof of anonymity — see IMPLEMENTATION_REVIEW.md, finding V7.</text>

<g>
  <rect x="45" y="212" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#E3E8EF"/>
  <text class="s mut" x="59" y="232" font-size="8">Teachers reporting</text><text class="s b ink" x="59" y="259" font-size="22">23</text><text class="s fade" x="96" y="259" font-size="8">of 26 enrolled</text>
  <rect x="255" y="212" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#E3E8EF"/>
  <text class="s mut" x="269" y="232" font-size="8">Lessons accepted</text><text class="s b ink" x="269" y="259" font-size="22">168</text><text class="s fade" x="318" y="259" font-size="8">5 duplicates rejected</text>
  <rect x="465" y="212" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#E3E8EF"/>
  <text class="s mut" x="479" y="232" font-size="8">Median observed per lesson</text><text class="s b ink" x="479" y="259" font-size="22">37 min</text><text class="s fade" x="561" y="259" font-size="8">of 40 elapsed</text>
  <rect x="675" y="212" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#E3E8EF"/>
  <text class="s mut" x="689" y="232" font-size="8">Cells suppressed this week</text><text class="s b ink" x="689" y="259" font-size="22">4</text><text class="s fade" x="712" y="259" font-size="8">fewer than 5 teachers</text>
</g>

