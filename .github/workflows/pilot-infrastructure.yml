name: Pilot infrastructure checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: echo_test
          POSTGRES_USER: echo_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ECHO_DB_ENGINE: postgresql
      ECHO_DB_NAME: echo_test
      ECHO_DB_USER: echo_test
      ECHO_DB_PASSWORD: disposable-ci-only
      ECHO_DB_HOST: localhost
      ECHO_DB_PORT: '5432'
      ECHO_DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/pilot/requirements.txt
      - run: python server/pilot/manage.py check
      - run: python server/pilot/manage.py makemigrations --check --dry-run
      - run: python server/pilot/manage.py test research
      - run: python -m unittest discover -s indicators-core/python/tests
      - run: python -m unittest discover -s server/tests
      - run: python -m unittest discover -s tests/demo
      - run: python -m unittest discover -s tests/infrastructure
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install scaffold SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-37' 'build-tools;37.0.0'"
      - name: Test, assemble and lint disconnected APK
        working-directory: edge/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
